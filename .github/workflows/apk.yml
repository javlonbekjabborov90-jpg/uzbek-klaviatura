name: APK Yigish
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Loyihani sozlash va APK yaratish
        run: |
          mkdir -p app/src/main/java/com/example/uzbekkeyboard
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          echo "android.useAndroidX=true" > gradle.properties
          echo 'rootProject.name="UzbekKeyboard"' > settings.gradle
          echo 'include(":app")' >> settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'

          android {
              namespace 'com.example.uzbekkeyboard'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.uzbekkeyboard"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Yangi O'zbek Alifbosi">
                  <service
                      android:name=".UzbekKeyboardService"
                      android:label="Yangi O'zbek Klaviaturasi"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android">
              <subtype
                  android:label="O‘zbek (Yangi alifbo)"
                  android:imeSubtypeLocale="uz_UZ"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/key_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_pressed="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#D4AF37" />
                      <corners android:radius="6dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <gradient
                          android:startColor="#1E1E1E"
                          android:endColor="#0A0A0A"
                          android:angle="270" />
                      <stroke android:width="1.5dp" android:color="#C5A059" />
                      <corners android:radius="6dp" />
                  </shape>
              </item>
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/layout/keyboard_view.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="#080808"
              android:orientation="vertical"
              android:padding="4dp">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="42dp"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingHorizontal="8dp">
                  <Button
                      android:id="@+id/btnLat"
                      android:layout_width="60dp"
                      android:layout_height="36dp"
                      android:background="@drawable/key_bg"
                      android:text="O‘z"
                      android:textColor="#D4AF37"
                      android:textStyle="bold" />
                  <Button
                      android:id="@+id/btnCyr"
                      android:layout_width="60dp"
                      android:layout_height="36dp"
                      android:layout_marginStart="8dp"
                      android:background="@drawable/key_bg"
                      android:text="Ўз"
                      android:textColor="#D4AF37"
                      android:textStyle="bold" />
              </LinearLayout>
              <LinearLayout
                  android:id="@+id/rowsContainer"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical" />
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="50dp"
                  android:layout_marginTop="4dp"
                  android:orientation="horizontal">
                  <Button
                      android:id="@+id/btnShift"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1.5"
                      android:layout_margin="2dp"
                      android:background="@drawable/key_bg"
                      android:text="⬆"
                      android:textColor="#D4AF37" />
                  <Button
                      android:id="@+id/btnSpace"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="5"
                      android:layout_margin="2dp"
                      android:background="@drawable/key_bg"
                      android:text="O‘zbekcha"
                      android:textColor="#FFFFFF" />
                  <Button
                      android:id="@+id/btnBackspace"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1.5"
                      android:layout_margin="2dp"
                      android:background="@drawable/key_bg"
                      android:text="⌫"
                      android:textColor="#D4AF37" />
                  <Button
                      android:id="@+id/btnEnter"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1.5"
                      android:layout_margin="2dp"
                      android:background="@drawable/key_bg"
                      android:text="↵"
                      android:textColor="#D4AF37" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/uzbekkeyboard/UzbekKeyboardService.kt
          package com.example.uzbekkeyboard

          import android.inputmethodservice.InputMethodService
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.graphics.Color

          class UzbekKeyboardService : InputMethodService() {
              private var isCaps = true
              private var isCyrillic = false
              private lateinit var rowsContainer: LinearLayout

              private val latinRows = listOf(
                  listOf("Q", "W", "E", "R", "T", "Y", "U", "O", "P", "Ğ"),
                  listOf("A", "S", "D", "F", "G", "H", "J", "K", "L", "Ş", "I"),
                  listOf("Z", "X", "C", "V", "B", "N", "M", "Ö", "Ç")
              )

              private val cyrillicRows = listOf(
                  listOf("Й", "Ц", "У", "К", "Е", "Н", "Г", "Ш", "Ў", "З", "Х", "Ғ"),
                  listOf("Ф", "Қ", "В", "А", "П", "Р", "О", "Л", "Д", "Ж", "Э"),
                  listOf("Я", "Ч", "С", "М", "И", "Т", "Ь", "Б", "Ю", "Ҳ")
              )

              override fun onCreateInputView(): View {
                  val rootView = layoutInflater.inflate(R.layout.keyboard_view, null)
                  rowsContainer = rootView.findViewById(R.id.rowsContainer)
                  renderKeys()

                  rootView.findViewById<Button>(R.id.btnLat).setOnClickListener {
                      isCyrillic = false
                      renderKeys()
                  }
                  rootView.findViewById<Button>(R.id.btnCyr).setOnClickListener {
                      isCyrillic = true
                      renderKeys()
                  }
                  rootView.findViewById<Button>(R.id.btnShift).setOnClickListener {
                      isCaps = !isCaps
                      renderKeys()
                  }
                  rootView.findViewById<Button>(R.id.btnSpace).setOnClickListener {
                      currentInputConnection?.commitText(" ", 1)
                  }
                  rootView.findViewById<Button>(R.id.btnBackspace).setOnClickListener {
                      currentInputConnection?.deleteSurroundingText(1, 0)
                  }
                  rootView.findViewById<Button>(R.id.btnEnter).setOnClickListener {
                      currentInputConnection?.sendKeyChar('\n')
                  }
                  return rootView
              }

              private var isCaps = true
              private fun renderKeys() {
                  rowsContainer.removeAllViews()
                  val currentLayout = if (isCyrillic) cyrillicRows else latinRows

                  for (row in currentLayout) {
                      val rowLayout = LinearLayout(this).apply {
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, 130
                          ).apply { setMargins(0, 4, 0, 4) }
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER
                      }

                      for (char in row) {
                          val displayChar = if (isCaps) char.uppercase() else char.lowercase()
                          val keyButton = Button(this).apply {
                              layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f).apply {
                                  setMargins(2, 0, 2, 0)
                              }
                              text = displayChar
                              setTextColor(Color.WHITE)
                              textSize = 16f
                              setBackgroundResource(R.drawable.key_bg)
                              setPadding(0, 0, 0, 0)
                              setOnClickListener {
                                  currentInputConnection?.commitText(displayChar, 1)
                              }
                          }
                          rowLayout.addView(keyButton)
                      }
                      rowsContainer.addView(rowLayout)
                  }
              }
          }
          EOF

          gradle wrapper --gradle-version 8.0
          ./gradlew assembleDebug --no-daemon

      - name: Tayyor APK yuklash
        uses: actions/upload-artifact@v4
        with:
          name: Yangi-Ozbek-Klaviaturasi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
